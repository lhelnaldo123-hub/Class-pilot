<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClassPilot icon maker</title>
<style>body{font-family:system-ui;background:#14284f;color:#fff;text-align:center;padding:30px}
button{background:#f2c037;color:#14284f;border:0;border-radius:12px;padding:16px 26px;font-size:1.1rem;font-weight:700;margin-top:20px}
canvas{border-radius:28px;width:180px;height:180px}</style></head>
<body>
<h2>ClassPilot icon maker</h2>
<canvas id="c" width="512" height="512"></canvas><br>
<button id="go">Download icons</button>
<p>You'll get 4 files. Put them next to index.html.</p>
<script>
function draw(cv, size) {
  cv.width = cv.height = size;
  const x = cv.getContext('2d');
  x.fillStyle = '#14284f'; x.fillRect(0, 0, size, size);
  const t = size * 0.56, o = (size - t) / 2, r = t * 0.22;
  x.fillStyle = '#f2c037'; x.beginPath(); x.roundRect(o, o, t, t, r); x.fill();
  const k = (t * 0.6) / 24;
  x.save(); x.translate(size / 2 - 12 * k, size / 2 - 12.5 * k); x.scale(k, k);
  x.strokeStyle = '#14284f'; x.lineWidth = 1.9; x.lineCap = x.lineJoin = 'round';
  x.stroke(new Path2D('M3 21V9l9-5 9 5v12zM9 21v-6h6v6'));
  x.restore();
}
draw(document.getElementById('c'), 512);
const files = [['icon-192.png',192],['icon-512.png',512],['icon-maskable-512.png',512],['apple-touch-icon.png',180]];
document.getElementById('go').onclick = async () => {
  for (const [name, size] of files) {
    const cv = document.createElement('canvas'); draw(cv, size);
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    await new Promise(r => setTimeout(r, 400));
  }
};
</script></body></html>
